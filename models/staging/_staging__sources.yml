version: 2

sources:
  - name: raw
    database: dbt_test_project
    schema: RAW
    tables:
      - name: apple_watch_sleep
        description: Raw Apple Watch sleep export (JSON VARIANT)
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: { count: 36, period: hour }
            error_after: { count: 72, period: hour }
      - name: apple_screen_time
        description: Daily Apple Screen Time export (JSON VARIANT with summary and array metrics)
      - name: home_temperature
      - name: weather_daily
      - name: nutrition_log
      - name: workouts