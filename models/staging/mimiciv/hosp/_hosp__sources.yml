version: 2

sources:
  - name: mimiciv_hosp
    database: MIMICIV
    schema: HOSP
    description: Hospital-wide MIMIC-IV data including diagnoses, procedures, lab events, and medications
    
    tables:
      - name: diagnoses_icd
        description: ICD diagnosis codes for admissions
      - name: procedures_icd
        description: ICD procedure codes for admissions
      - name: drgcodes
        description: DRG codes and severity for admissions
      - name: labevents
        description: Laboratory test results
      - name: prescriptions
        description: Medication prescriptions
      - name: pharmacy
        description: Pharmacy records
      - name: emar
        description: Electronic medication administration records
      - name: emar_detail
        description: Detailed medication administration information
      - name: poe
        description: Provider order entry records
      - name: poe_detail
        description: Detailed provider order information
      - name: microbiologyevents
        description: Microbiology culture results
      - name: hcpcsevents
        description: Healthcare procedure coding events
      - name: services
        description: Hospital service assignments
      - name: codes
        description: Code lookup table
      - name: d_hcpcs
        description: HCPCS code dictionary
      - name: d_icd_diagnoses
        description: ICD diagnosis code dictionary
      - name: d_icd_procedures
        description: ICD procedure code dictionary
      - name: d_labitems
        description: Lab item dictionary
