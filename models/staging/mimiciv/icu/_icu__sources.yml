version: 2

sources:
  - name: mimiciv_icu
    database: MIMICIV
    schema: ICU
    description: ICU-specific MIMIC-IV data including vital signs, medications, and procedures
    
    tables:
      - name: icustays
        description: ICU stay information
      - name: chartevents
        description: Vital signs and observations
      - name: inputevents
        description: Fluid and medication inputs
      - name: outputevents
        description: Output measurements
      - name: procedureevents
        description: ICU procedures performed
      - name: datetimeevents
        description: Timestamped clinical events
      - name: d_items
        description: Item dictionary for ICU events
