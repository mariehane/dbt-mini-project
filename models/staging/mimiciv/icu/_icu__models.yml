version: 2

models:
  - name: stg_icu__icustays
    description: Staged ICU stay information
    columns:
      - name: stay_id
        description: Unique ICU stay identifier
        tests:
          - not_null
          - unique
      - name: subject_id
        description: Patient identifier
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_core__patients')
                field: subject_id
      - name: hadm_id
        description: Hospital admission identifier
        tests:
          - not_null
      - name: first_careunit
        description: First ICU care unit
      - name: last_careunit
        description: Last ICU care unit
      - name: intime
        description: ICU admission time
      - name: outtime
        description: ICU discharge time
      - name: los
        description: Length of stay in days

  - name: stg_icu__chartevents
    description: Staged vital signs and observations
    columns:
      - name: subject_id
        description: Patient identifier
        tests:
          - not_null
      - name: hadm_id
        description: Hospital admission identifier
      - name: stay_id
        description: ICU stay identifier
      - name: itemid
        description: Item identifier
        tests:
          - not_null
      - name: charttime
        description: Chart time
      - name: value
        description: Observation value
      - name: valuenum
        description: Numeric observation value

  - name: stg_icu__inputevents
    description: Staged fluid and medication inputs
    columns:
      - name: subject_id
        description: Patient identifier
        tests:
          - not_null
      - name: hadm_id
        description: Hospital admission identifier
      - name: stay_id
        description: ICU stay identifier
      - name: itemid
        description: Item identifier
        tests:
          - not_null
      - name: starttime
        description: Input start time
      - name: endtime
        description: Input end time
      - name: amount
        description: Input amount

  - name: stg_icu__outputevents
    description: Staged output measurements
    columns:
      - name: subject_id
        description: Patient identifier
        tests:
          - not_null
      - name: hadm_id
        description: Hospital admission identifier
      - name: stay_id
        description: ICU stay identifier
      - name: itemid
        description: Item identifier
        tests:
          - not_null
      - name: charttime
        description: Chart time
      - name: value
        description: Output value

  - name: stg_icu__procedureevents
    description: Staged ICU procedures
    columns:
      - name: subject_id
        description: Patient identifier
        tests:
          - not_null
      - name: hadm_id
        description: Hospital admission identifier
      - name: stay_id
        description: ICU stay identifier
      - name: itemid
        description: Item identifier
        tests:
          - not_null
      - name: starttime
        description: Procedure start time
      - name: endtime
        description: Procedure end time

  - name: stg_icu__datetimeevents
    description: Staged timestamped clinical events
    columns:
      - name: subject_id
        description: Patient identifier
        tests:
          - not_null
      - name: hadm_id
        description: Hospital admission identifier
      - name: stay_id
        description: ICU stay identifier
      - name: itemid
        description: Item identifier
        tests:
          - not_null
      - name: charttime
        description: Chart time
      - name: value
        description: Event value

  - name: stg_icu__d_items
    description: Staged item dictionary
    columns:
      - name: itemid
        description: Item identifier
        tests:
          - not_null
          - unique
      - name: label
        description: Item label
      - name: category
        description: Item category
      - name: unitname
        description: Unit of measurement
