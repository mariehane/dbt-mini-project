version: 2

sources:
  - name: mimiciv_core
    database: MIMICIV
    schema: CORE
    description: Core MIMIC-IV patient and admission data
    
    tables:
      - name: patients
        description: Patient demographics and anchor information
        columns:
          - name: subject_id
            description: Patient identifier
          - name: gender
            description: Gender (M/F)
          - name: anchor_age
            description: Patient age at anchor year
          - name: anchor_year
            description: Anchor year for patient
          - name: anchor_year_group
            description: Anchor year group range
          - name: dod
            description: Date of death
            
      - name: admissions
        description: Hospital admission records
        columns:
          - name: subject_id
            description: Patient identifier
          - name: hadm_id
            description: Hospital admission identifier
          - name: admittime
            description: Admission time
          - name: dischtime
            description: Discharge time
          - name: deathtime
            description: Death time during admission
          - name: admission_type
            description: Type of admission
          - name: admission_location
            description: Admission location/source
          - name: discharge_location
            description: Discharge location/destination
          - name: insurance
            description: Insurance type
          - name: language
            description: Patient language
          - name: marital_status
            description: Marital status
          - name: ethnicity
            description: Ethnicity
          - name: edregtime
            description: Emergency department registration time
          - name: edouttime
            description: Emergency department out time
          - name: hospital_expire_flag
            description: Hospital expire flag
            
      - name: transfers
        description: Patient transfer events within hospital
        columns:
          - name: subject_id
            description: Patient identifier
          - name: hadm_id
            description: Hospital admission identifier
          - name: transfer_id
            description: Transfer event identifier
          - name: eventtype
            description: Type of transfer event
          - name: careunit
            description: Care unit location
          - name: intime
            description: Transfer in time
          - name: outtime
            description: Transfer out time
